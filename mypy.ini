[mypy]
# Import discovery
exclude = (?x)(
    ^todo/migrations/  # Exclude Django migration files
  | ^tests/            # Test files
  )
exclude_gitignore = True
ignore_missing_imports = True

# Platform configuration
python_version = 3.13

# Disallow dynamic typing
disallow_any_unimported = False
disallow_subclassing_any = False

# Untyped definitions and calls
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True

# None and Optional handling
strict_optional = True

# Configuring warnings
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_return_any = True
warn_unreachable = True

# Suppressing errors
ignore_errors = False

# Miscellaneous strictness flags
strict = True

# Configuring error messages
show_error_context = True
show_column_numbers = True
show_error_code_links = True
pretty = True
color_output = True
error_summary = True

# Advanced options
show_traceback = True
raise_exceptions = True
warn_incomplete_stub = True

[mypy-aiofiles.*]
ignore_missing_imports = True

[mypy-todo.ics]
disallow_untyped_calls = False

# djangorestframework ships no type stubs, so its decorators are untyped.
# Explicitly allow untyped decorators in the auth_views and views modules.
[mypy-todo.auth_views]
disallow_untyped_decorators = False

[mypy-todo.views]
disallow_untyped_decorators = False
