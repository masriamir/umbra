[build]
builder = "nixpacks"
# Build the React SPA, then collect Django static files. Both outputs are
# required before the server starts: WhiteNoise serves the SPA from
# frontend/dist/ and Django admin assets from staticfiles/.
buildCommand = "pip install uv && uv sync --no-dev && cd frontend && npm ci && npm run build && cd .. && uv run python manage.py collectstatic --noinput"

[deploy]
# Run migrations on every deploy (idempotent), then start gunicorn.
startCommand = "uv run python manage.py migrate && uv run gunicorn umbra.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 30"
healthcheckPath = "/health/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
