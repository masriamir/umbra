[project]
name = "umbra"
dynamic = ["version"]
description = "A TODO web application to aid in disrupted executive functioning due to ADHD."
authors = [
    { name = "Amir Masri", email = "masriamir@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.5,<7.0.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "django-environ>=0.13.0,<1.0.0",
    "djangorestframework>=3.17.1,<4.0.0",
    "django-cors-headers>=4.9.0,<5.0.0",
    "icalendar>=7.1.0,<8.0.0",
    "django-csp>=4.0,<5.0",
    "whitenoise>=6.12.0,<7.0.0",
    "gunicorn>=25.3.0,<26.0.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: WSGI",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: Office/Business :: Scheduling",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/masriamir/umbra"
Repository = "https://github.com/masriamir/umbra"
Issues = "https://github.com/masriamir/umbra/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.12,<1.0.0",  # Linting and formatting
    "ty>=0.0.40,<0.1.0",  # Type checking
    "bandit>=1.9.4,<2.0.0",  # Security analysis
]

test = [
    "pytest>=9.1.0,<10.0.0",  # Testing framework
    "pytest-django>=4.12.0,<5.0.0",  # Django integration for pytest
    "pytest-cov>=7.1.0,<8.0.0",  # Coverage reporting
    "pytest-watch>=4.2.0,<5.0.0",  # Watch mode for tests
    "pytest-asyncio>=1.4.0,<2.0.0",  # Async test support
    "httpx>=0.28.1,<1.0.0",  # Async HTTP client for testing
]

quality = [
    "pre-commit>=4.6.0,<5.0.0",  # Pre-commit hooks
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } }
]
default-groups = [
    "dev",
    "test",
]
required-version = ">=0.9.9,<1.0.0"

[tool.uv.pip]
python-version = "3.14"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

