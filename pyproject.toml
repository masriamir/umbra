[project]
name = "ef-todo"
dynamic = ["version"]
description = "A ToDo web application to aid in disrupted executive functioning due to ADHD."
authors = [
    { name = "Amir Masri", email = "masriamir@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2.11,<6.0.0",
    "psycopg[binary]>=3.3.3,<4.0.0",
    "django-environ>=0.13.0,<1.0.0",
    "djangorestframework>=3.17.1,<4.0.0",
    "django-cors-headers>=4.9.0,<5.0.0",
    "icalendar>=7.0.3,<8.0.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: WSGI",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: Office/Business :: Scheduling",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/masriamir/ef-todo"
Repository = "https://github.com/masriamir/ef-todo"
Issues = "https://github.com/masriamir/ef-todo/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.8,<1.0.0",  # Linting and formatting
    "mypy>=1.19.1,<2.0.0",  # Type checking
    "types-aiofiles>=25.1.0.20251011,<26.0.0",  # Type stubs for aiofiles
]

test = [
    "pytest>=9.0.2,<10.0.0",  # Testing framework
    "pytest-django>=4.12.0,<5.0.0",  # Django integration for pytest
    "pytest-cov>=7.1.0,<8.0.0",  # Coverage reporting
    "pytest-watch>=4.2.0,<5.0.0",  # Watch mode for tests
    "pytest-asyncio>=1.3.0,<2.0.0",  # Async test support
    "httpx>=0.28.1,<1.0.0",  # Async HTTP client for testing
]

quality = [
    "pre-commit>=4.5.1,<5.0.0",  # Pre-commit hooks
]

[tool.ruff]
extend-exclude = [
    "todo/migrations",
]
line-length = 88
target-version = "py313"
src = [
    "todo",
    "ef_todo",
]

[tool.ruff.lint]
select = [
    #"ANN",  # flake8-annotations
    "S",  # flake8-bandit
    "B",  # flake8-bugbear
    "A",  # flake8-builtins
    "COM",  # flake8-commas
    "C4",  # flake8-comprehensions
    #"DTZ",  # flake8-datetimez
    #"INT",  # flake8-gettext
    #"ISC",  # flake8-implicit-str-concat
    #"ICN",  # flake8-import-conventions
    #"LOG",  # flake8-logging
    #"G",  # flake8-logging-format
    "T20",  # flake8-print
    #"PYI",  # flake8-pyi
    #"PT",  # flake8-pytest-style
    #"Q",  # flake8-quotes
    #"RET",  # flake8-return
    #"SLF",  # flake8-self
    #"SIM",  # flake8-simplify
    #"TC",  # flake8-type-checking
    #"ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "I",  # isort
    "C90",  # mccabe
    "N",  # pep8-naming
    "E",  # pycodestyle-error
    "W",  # pycodestyle-warning
    #"DOC",  # pydoclint
    "D",  # pydocstyle
    "F",  # Pyflakes
    "PL",  # Pylint
    "UP",  # pyupgrade
    "RUF"  # Ruff-specific rules
]
ignore = [
    "E501",  # Line too long
    "COM812",  # Missing trailing comma
    "RUF012",  # Mutable default value for class attribute
    "D105",  # Missing docstring in magic method (__str__ etc. are self-evident)
    "D106",  # Missing docstring in public nested class (Django/DRF Meta classes)
    "D107",  # Missing docstring in __init__ (covered by class docstring)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert statements
    "PLR2004",  # Magic value comparisons in tests
    "PLC0415",  # Import is not at top level
    "D102",  # Test methods don't need docstrings
    "D103",  # Test functions and fixtures don't need docstrings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = [
    "todo",
    "ef_todo",
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } }
]
default-groups = [
    "dev",
    "test",
]
required-version = ">=0.9.9,<1.0.0"

[tool.uv.pip]
python-version = "3.13"

[tool.hatch.version]
source = "vcs"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
