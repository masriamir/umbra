extend-exclude = [
    "todo/migrations",
]
line-length = 88
target-version = "py314"
src = [
    "todo",
    "umbra",
]

[lint]
select = [
    #"ANN",  # flake8-annotations
    "S",  # flake8-bandit
    "B",  # flake8-bugbear
    "A",  # flake8-builtins
    "COM",  # flake8-commas
    "C4",  # flake8-comprehensions
    #"DTZ",  # flake8-datetimez
    #"INT",  # flake8-gettext
    #"ISC",  # flake8-implicit-str-concat
    #"ICN",  # flake8-import-conventions
    #"LOG",  # flake8-logging
    #"G",  # flake8-logging-format
    "T20",  # flake8-print
    #"PYI",  # flake8-pyi
    #"PT",  # flake8-pytest-style
    #"Q",  # flake8-quotes
    #"RET",  # flake8-return
    #"SLF",  # flake8-self
    #"SIM",  # flake8-simplify
    #"TC",  # flake8-type-checking
    #"ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "I",  # isort
    "C90",  # mccabe
    "N",  # pep8-naming
    "E",  # pycodestyle-error
    "W",  # pycodestyle-warning
    #"DOC",  # pydoclint
    "D",  # pydocstyle
    "F",  # Pyflakes
    "PL",  # Pylint
    "UP",  # pyupgrade
    "RUF"  # Ruff-specific rules
]
ignore = [
    "E501",  # Line too long
    "COM812",  # Missing trailing comma
    "RUF012",  # Mutable default value for class attribute
    "D105",  # Missing docstring in magic method (__str__ etc. are self-evident)
    "D106",  # Missing docstring in public nested class (Django/DRF Meta classes)
    "D107",  # Missing docstring in __init__ (covered by class docstring)
]

[lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert statements
    "S106",  # hardcoded passwords
    "PLR2004",  # Magic value comparisons in tests
    "PLC0415",  # Import is not at top level
    "D102",  # Test methods don't need docstrings
    "D103",  # Test functions and fixtures don't need docstrings
]

[lint.pydocstyle]
convention = "google"

[lint.isort]
known-first-party = [
    "todo",
    "umbra",
]

[lint.flake8-quotes]
inline-quotes = "double"

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
