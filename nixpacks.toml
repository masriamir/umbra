[phases.setup]
# nodejs_22: not auto-detected by nixpacks for Python projects; required to
# build the React SPA in the build phase.
# cmds: install the latest uv release into /usr/local/bin so the install
# phase can find it on PATH. We avoid adding uv to nixPkgs because the
# pinned nix version (0.4.30) is too old for required-version ">=0.9.9".
nixPkgs = ["nodejs_22"]
cmds = ["curl -LsSf https://astral.sh/uv/0.11.8/install.sh | UV_INSTALL_DIR=/usr/local/bin sh"]

[phases.install]
# Without this override, nixpacks auto-generates a `python -m venv &&
# pip install uv==0.4.30 && uv sync` path that (a) requires the `python`
# binary which is absent in the base image, and (b) pins an old uv.
# With uv already on PATH from the setup cmds above, this is all we need.
cmds = ["uv sync --no-dev --frozen"]
