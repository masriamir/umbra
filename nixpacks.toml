[phases.setup]
# nixpacks pins nodejs_22 to 22.10.0, but Vite 8 / rolldown require Node
# >= 22.12.0. Install Node.js 22.x via NodeSource (always the latest patch)
# instead of nix, which gives us a compliant version.
# uv is installed separately via its own installer since the nix-pinned
# version (0.4.30) is too old for required-version ">=0.9.9".
nixPkgs = []
cmds = [
    "curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y -q nodejs",
    "curl -LsSf https://astral.sh/uv/0.11.8/install.sh | UV_INSTALL_DIR=/usr/local/bin sh"
]

[phases.install]
# Without this override, nixpacks auto-generates a `python -m venv &&
# pip install uv` path that expects the `python` binary on PATH.
cmds = ["uv sync --no-dev --frozen"]
