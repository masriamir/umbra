[phases.setup]
# nodejs_22 is not auto-detected by nixpacks because this is primarily a
# Python project; it is required to build the React SPA in the build phase.
nixPkgs = ["nodejs_22"]

[phases.install]
# Override nixpacks' auto-generated install step, which pins uv==0.4.30 (too
# old for Python 3.14 and the required-version field). Install the latest uv,
# then use it to download Python 3.14 via its managed installer before syncing.
cmds = [
    "pip install uv",
    "uv python install",
    "uv sync --no-dev --frozen",
]
