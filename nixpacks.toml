[phases.setup]
# nodejs_22: not auto-detected by nixpacks because this is primarily a Python
# project, but required to build the React SPA in the build phase.
# uv: must be present before nixpacks' auto-generated install step runs
# (`uv sync --no-dev --frozen`). uv will auto-download Python 3.14 via
# python-build-standalone when syncing (python-downloads = "automatic").
nixPkgs = ["nodejs_22", "uv"]
